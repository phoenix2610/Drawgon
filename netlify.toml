# Netlify build configuration for the Drawgon frontend.
#
# Only the Vite frontend is deployed here. The NestJS backend needs a
# persistent process (socket.io voice gateway) and a live Postgres
# connection, so it has to run somewhere that hosts long-lived servers.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # vite.config.ts uses `import.meta.dirname`, which only exists on
  # Node >= 20.11. On Netlify's older default image this is `undefined`
  # and the build dies with:
  #   TypeError: The "paths[0]" argument must be of type string
  NODE_VERSION = "22"

# Single-page app: React Router owns the routes, so every path must be
# served index.html. Without this, /home, /login, /c/<slug> and every
# other deep link 404s on refresh or direct navigation.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# NOTE: VITE_API_URL is inlined at build time, not read at runtime. Set it
# in Netlify's UI (Site settings -> Environment variables) BEFORE building,
# or the bundle falls back to http://localhost:3000 and every API call from
# the deployed site fails.
